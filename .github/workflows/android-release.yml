name: Generate Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'شماره نسخه انتشار (مثال: 1.1.0 یا v1.1.0) - در صورت خالی گذاشتن بر اساس شماره اجرا ساخته می‌شود'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            CLEAN_VER="${INPUT_VER#v}"
            TAG_VER="v${CLEAN_VER}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CLEAN_VER="${GITHUB_REF#refs/tags/v}"
            TAG_VER="${GITHUB_REF#refs/tags/}"
          else
            CLEAN_VER="1.1.${{ github.run_number }}"
            TAG_VER="v${CLEAN_VER}"
          fi
          
          RUN_NUM="${{ github.run_number }}"
          echo "VERSION_NAME=${CLEAN_VER}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_VER}" >> $GITHUB_ENV
          echo "VERSION_CODE=${RUN_NUM}" >> $GITHUB_ENV
          echo "Target Version: ${CLEAN_VER} (Tag: ${TAG_VER}, Code: ${RUN_NUM})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Generate and Set Up Gradle Wrapper
        run: |
          echo "Generating Gradle wrapper with compatible version 8.5..."
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Update Versioning in Build Gradle
        run: |
          sed -i "s/versionCode = 1/versionCode = $VERSION_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"1.0.0\"/versionName = \"$VERSION_NAME\"/g" app/build.gradle.kts
          echo "Updated app/build.gradle.kts with Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Keystore File
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'telegramchecker' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'telegramchecker' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
        run: |
          import base64
          import os
          import subprocess

          keystore_b64 = os.environ.get("KEYSTORE_BASE64", "").strip()
          keystore_pass = os.environ.get("KEYSTORE_PASSWORD", "telegramchecker").strip()
          key_pass = os.environ.get("KEY_PASSWORD", "telegramchecker").strip()
          key_alias = os.environ.get("KEY_ALIAS", "release").strip()

          if keystore_b64:
              print("KEYSTORE_BASE64 secret found! Decoding your persistent signing key...")
              clean_b64 = "".join(keystore_b64.split())
              with open("release.keystore", "wb") as f:
                  f.write(base64.b64decode(clean_b64))
          else:
              print("KEYSTORE_BASE64 secret not found! Generating a temporary keystore on-the-fly...")
              cmd = [
                  "keytool", "-genkey", "-v",
                  "-keystore", "release.keystore",
                  "-alias", key_alias,
                  "-keyalg", "RSA",
                  "-keysize", "2048",
                  "-validity", "10000",
                  "-storepass", keystore_pass,
                  "-keypass", key_pass,
                  "-dname", "CN=tgproxy, O=tgproxy, C=US"
              ]
              subprocess.run(cmd, check=True)

      - name: Sign APK with apksigner
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'telegramchecker' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'telegramchecker' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
        run: |
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          FINAL_APK_NAME="Telegram-Proxy-Checker-v${VERSION_NAME}.apk"
          echo "FINAL_APK_NAME=${FINAL_APK_NAME}" >> $GITHUB_ENV
          
          $APKSIGNER_PATH sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$FINAL_APK_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk
            
          $APKSIGNER_PATH verify "$FINAL_APK_NAME"
          echo "Successfully signed $FINAL_APK_NAME"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Telegram Proxy Checker ${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          body: |
            ## 🛡️ Telegram Proxy Checker ${{ env.TAG_NAME }}
            
            ### 🌟 قابلیت‌های جدید و بهینه‌سازی‌ها:
            - **پشتیبانی کامل از هر ۴ پروتکل تلگرام:** تست عمیق و واقعی MTProto (ساده، dd، Fake-TLS)، SOCKS5، HTTP CONNECT و WebProxy.
            - **پروفایل‌های هوشمند شبکه:** سریع (۳ ثانیه / ۵۰ همزمان)، متعادل (۵ ثانیه / ۲۵ همزمان)، و اختلال شدید / اینترانت (۶۰ ثانیه / ۱۰ همزمان).
            - **کلید پیش‌چک TCP:** امکان غیرفعال‌سازی پیش‌چک در زمان اینترانت جهت جلوگیری از حذف اشتباه پروکسی‌های کند.
            - **داشبورد آمار زنده تفکیکی:** نمایش تعداد پروکسی‌های سالم به تفکیک هر ۴ پروتکل به همراه کمترین و میانگین پینگ.
            - **لیست تعاملی پروکسی‌های سالم:** کارت‌های تفکیک‌شده با برچسب پروتکل، پینگ رنگی، دکمه کپی و اتصال مستقیم به تلگرام.
            - **سیستم سابسکریپشن مقاوم:** افزایش تایم‌اوت به ۲۵ و ۴۵ ثانیه و دیکود خودکار Base64 برای جلوگیری از لغو زودهنگام در لیست‌های حجیم.
            - **خروجی متنوع:** پشتیبانی کامل از دریافت TXT و JSON، کپی N تای برتر و اتصال مستقیم سریع‌ترین پروکسی.
            
            📢 **کانال رسمی تلگرام:** [@vpnclashfa](https://t.me/vpnclashfa)
          files: |
            ${{ env.FINAL_APK_NAME }}
